[project]
name = "vstpreset-mcp"
version = "0.1.0"
description = "MCP server for VST3 parameter control and preset generation research"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
vstpreset-mcp = "vstpreset_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
